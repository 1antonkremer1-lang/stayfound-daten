name: Gebietsdateien erzeugen

# Baut fuer ganze Bundeslaender und Laender fertige Dateien mit Adressen und Strassen
# (aus OpenStreetMap-Auszuegen von download.geofabrik.de) und legt sie unter "Releases"
# mit der Marke "gebietsdateien" ab. Die App laedt sie von dort.

on:
  workflow_dispatch:
    inputs:
      regionen:
        description: 'Regionen, mit Komma getrennt (siehe tools/gebietsdateien/regionen.py), "deutschland" fuer alle 16 Bundeslaender, oder "alle"'
        required: true
        default: bayern

permissions:
  contents: write

concurrency:
  group: gebietsdateien
  cancel-in-progress: false

env:
  MARKE: gebietsdateien

jobs:
  plan:
    name: Regionen festlegen
    runs-on: ubuntu-latest
    outputs:
      regionen: ${{ steps.auswahl.outputs.regionen }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeug testen
        run: |
          pip install -r tools/gebietsdateien/requirements.txt
          cd tools/gebietsdateien && python3 -m unittest -v

      - name: Regionen auswaehlen
        id: auswahl
        env:
          REGIONEN: ${{ inputs.regionen }}
        run: |
          liste=$(python3 tools/gebietsdateien/erzeugen.py matrix "$REGIONEN")
          echo "regionen=$liste" >> "$GITHUB_OUTPUT"
          echo "Regionen: $liste"

      - name: Veroeffentlichung anlegen, falls sie fehlt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$MARKE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$MARKE" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "Gebietsdateien" \
              --notes "Adressen und Strassen ganzer Regionen fuer die App. Daten: OpenStreetMap-Mitwirkende (ODbL), Auszuege von download.geofabrik.de. Die Liste steht in index.json."
          fi

  bauen:
    name: ${{ matrix.region }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      # Eine misslungene Region soll die anderen nicht aufhalten.
      fail-fast: false
      max-parallel: 2
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regionen) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeug einrichten
        run: pip install -r tools/gebietsdateien/requirements.txt

      - name: Platz schaffen
        # Grosse Laender brauchen viel Platz (Auszug, Punktablage, Datei, gepackte Datei).
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"

      # Der Server lehnt manchmal die Verbindung ab: mehrmals versuchen, auch bei Verbindungsfehlern.
      - name: Kartenauszug laden
        env:
          REGION: ${{ matrix.region }}
        run: |
          url=$(python3 tools/gebietsdateien/erzeugen.py url "$REGION")
          echo "Lade $url"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 30 --retry-all-errors \
            --user-agent "gebietsdateien (GitHub Actions)" \
            --output "$RUNNER_TEMP/auszug.osm.pbf" "$url"
          ls -l "$RUNNER_TEMP/auszug.osm.pbf"

      - name: Gebietsdatei erzeugen
        env:
          REGION: ${{ matrix.region }}
        # Bricht mit klarer Meldung ab, wenn die gepackte Datei 2 GB erreicht.
        run: |
          python3 tools/gebietsdateien/erzeugen.py bauen "$RUNNER_TEMP/auszug.osm.pbf" \
            --region "$REGION" --ziel "$RUNNER_TEMP/out"
          rm -f "$RUNNER_TEMP/auszug.osm.pbf"
          ls -l "$RUNNER_TEMP/out"

      - name: Groesse pruefen
        env:
          REGION: ${{ matrix.region }}
        run: |
          bytes=$(stat -c %s "$RUNNER_TEMP/out/$REGION.sqlite.gz")
          if [ "$bytes" -ge 2000000000 ]; then
            echo "::error::$REGION.sqlite.gz ist $bytes Bytes gross. Anhaenge duerfen hoechstens 2 GB haben."
            exit 1
          fi

      - name: Hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ matrix.region }}
        # --clobber ersetzt einen vorhandenen Anhang gleichen Namens.
        run: |
          gh release upload "$MARKE" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/out/$REGION.sqlite.gz" "$RUNNER_TEMP/out/$REGION.info.json"

  index:
    name: index.json schreiben
    needs: [plan, bauen]
    # Auch wenn einzelne Regionen misslungen sind: die Liste muss zu den Anhaengen passen.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Angaben aller Regionen holen und zusammenfassen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/info"
          gh release download "$MARKE" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.info.json' --dir "$RUNNER_TEMP/info"
          python3 tools/gebietsdateien/erzeugen.py index "$RUNNER_TEMP/info" --ziel "$RUNNER_TEMP/index.json"
          cat "$RUNNER_TEMP/index.json"
          gh release upload "$MARKE" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/index.json"
